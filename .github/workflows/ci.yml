name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Module verification
        run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...
      - name: Bounded fuzz smoke
        run: go test ./contract -run=^$ -fuzz=FuzzParseBounded -fuzztime=5s -parallel=1
      - name: Import graph conformance
        run: go test ./internal/tooling/graphcheck -run 'TestSyntheticGraphs|TestFixtureProvenance|TestDiscoveryDoesNotExecuteInit'
      - run: go build ./...
