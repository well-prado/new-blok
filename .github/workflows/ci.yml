name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Module verification
        run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...
      - name: Bounded fuzz smoke
        run: go test ./contract -run=^$ -fuzz=FuzzParseBounded -fuzztime=5s -parallel=1
      - name: Import graph conformance
        run: go test ./internal/tooling/graphcheck -run 'TestSyntheticGraphs|TestFixtureProvenance|TestDiscoveryDoesNotExecuteInit'
      - run: go build ./...
