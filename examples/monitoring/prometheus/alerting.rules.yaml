# Alerting rules for the Blok operational SLO catalogue (ADR 0022). Load
# them together with recording.rules.yaml.
#
# Severity is the paging contract:
#   page   - a person must act now: a run whose owner died, an unowned
#            partition, an unavailable worker, a not-ready deployment, a
#            timer that stopped firing.
#   warn   - degradation that needs attention in working hours.
#   ticket - needs a decision, never a restart: uncertain outcomes awaiting
#            reconciliation, telemetry loss.
# Work WAITING on a signal, a timer or a retry backoff never alerts. Work
# whose effect outcome is UNCERTAIN alerts as a ticket, never as STALLED and
# never as an error. Thresholds marked "example" are application choices.
groups:
  - name: blok-slo-alerts
    interval: 30s
    rules:
      - alert: BlokRunsStalled
        expr: blok:work_stalled:max > 0
        for: 2m
        labels:
          severity: page
          blok_alert_class: stalled
        annotations:
          summary: Unfinished work has lost its owner
          description: >-
            {{ $value }} items of {{ $labels.blok_source }} are claimed by an
            owner whose lease expired, or sit in a partition without a live
            owner. Waiting and uncertain work are not counted here.

      - alert: BlokPartitionUnowned
        expr: blok:partitions_unowned:max > 0
        for: 2m
        labels:
          severity: page
          blok_alert_class: worker_availability
        annotations:
          summary: Durable partitions have no live owner
          description: An unowned partition claims no run and fires no timer.

      - alert: BlokWorkerUnavailable
        expr: max by (job, blok_worker) (blok_worker_ready) == 0
        for: 2m
        labels:
          severity: page
          blok_alert_class: worker_availability
        annotations:
          summary: A worker runtime is not accepting calls

      - alert: BlokNotReady
        expr: max by (job, instance) (blok_ready) == 0 unless on (job, instance) max by (job, instance) (blok_draining) == 1
        for: 2m
        labels:
          severity: page
          blok_alert_class: readiness
        annotations:
          summary: A deployment is not ready and is not draining

      - alert: BlokTimerLag
        expr: blok:timer_lag_seconds:max > 60
        for: 2m
        labels:
          severity: page
          blok_alert_class: timer_lag
        annotations:
          summary: Due timers are not firing
          description: The oldest unfired timer of {{ $labels.blok_source }} is {{ $value }}s past due.

      - alert: BlokUncertainOutcomes
        expr: blok:runs_uncertain:increase15m > 0 or blok:external_calls_uncertain:increase15m > 0 or blok:work_uncertain:max > 0
        labels:
          severity: ticket
          blok_alert_class: uncertain
        annotations:
          summary: Effects with unknown outcomes await reconciliation
          description: These are not failures and must not be retried blindly; reconcile them with the effect provider.

      - alert: BlokRunErrorRatioHigh
        expr: blok:runs_failed:ratio_rate5m > 0.05
        for: 10m
        labels:
          severity: warn
          blok_alert_class: errors
        annotations:
          summary: More than 5% of runs fail (example threshold; uncertain runs are excluded)

      - alert: BlokAdmissionSaturated
        expr: blok:admission_saturation:ratio > 0.9
        for: 10m
        labels:
          severity: warn
          blok_alert_class: admission_saturation
        annotations:
          summary: Admission slots are more than 90% used

      - alert: BlokAdmissionShedding
        expr: sum by (job) (blok:admission_rejected:rate5m{blok_reason=~"capacity|unavailable"}) > 0
        for: 5m
        labels:
          severity: warn
          blok_alert_class: admission_saturation
        annotations:
          summary: Admission is rejecting requests for capacity or store availability

      - alert: BlokQueueBacklog
        expr: blok:work_backlog_seconds:max > 300
        for: 5m
        labels:
          severity: warn
          blok_alert_class: queue_depth
        annotations:
          summary: Pending work has waited more than five minutes for a worker (example threshold)

      - alert: BlokStepLatencyHigh
        expr: blok:step_duration_seconds:p99_5m > 1
        for: 10m
        labels:
          severity: warn
          blok_alert_class: latency
        annotations:
          summary: Step p99 latency is above one second (example threshold)

      - alert: BlokExternalCallLatencyHigh
        expr: blok:external_call_duration_seconds:p99_5m > 2
        for: 10m
        labels:
          severity: warn
          blok_alert_class: latency
        annotations:
          summary: External call p99 latency is above two seconds (example threshold)

      - alert: BlokStorageBudgetForecast
        expr: max by (job, blok_store) (predict_linear(blok_storage_used_bytes[6h], 7 * 86400)) > on (job, blok_store) max by (job, blok_store) (blok_storage_budget_bytes)
        for: 30m
        labels:
          severity: warn
          blok_alert_class: storage_growth
        annotations:
          summary: The store is forecast to exceed its declared budget within seven days

      - alert: BlokCensusTruncated
        expr: max by (job, blok_source) (blok_census_truncated) == 1
        for: 15m
        labels:
          severity: ticket
          blok_alert_class: queue_depth
        annotations:
          summary: A work census hit its read bound; its counts are lower bounds

      - alert: BlokTelemetryLoss
        expr: sum by (job) (blok:telemetry_dropped:rate10m) > 0
        for: 10m
        labels:
          severity: ticket
          blok_alert_class: exporter_loss
        annotations:
          summary: The telemetry exporter is dropping data (runs are unaffected)

      - alert: BlokOperationalSamplingFailing
        expr: sum by (job) (rate(blok_operational_sample_failures_total[10m])) > 0
        for: 10m
        labels:
          severity: ticket
          blok_alert_class: exporter_loss
        annotations:
          summary: An operational source keeps failing or timing out
